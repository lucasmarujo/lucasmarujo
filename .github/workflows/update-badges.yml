name: Update Badges

on:
  schedule:
    # 11h no horário de Brasília (UTC-3) = 14h UTC
    - cron: "0 14 * * *"
  workflow_dispatch: # Allow manual runs

jobs:
  update-badges:
    name: Update README with Credly Badges
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test badges script
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Update Badges
        env:
          CREDLY_USER: lucas-marujo-amadeu # Seu username do Credly (credly.com/users/<username>)
          NUMBER_LAST_BADGES: 0 # Show all badges (N = last N badges)
        run: python3 .github/scripts/update_badges.py

      - name: Commit README
        run: |
          if git diff --quiet -- README.md; then
            echo "No badge changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Updated README with new badges"
          git push